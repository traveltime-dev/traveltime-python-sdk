# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package with dependencies
        run: |
          pip install -U setuptools
          pip install -e ".[test,proto]"
      - name: Lint with flake8
        run: |
          flake8 --max-line-length=127 --ignore=E203
      - name: Formatting check with black
        run: |
          black . --check --diff
      - name: Docstring formatting check with docformatter
        run: |
          docformatter --check --recursive --wrap-summaries 88 --wrap-descriptions 88 .
      - name: Type check with mypy
        run: |
          mypy --install-types --non-interactive .
          mypy .

      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '29.6'

      - name: Generate proto files
        run: |
          protoc -I=. --python_out=. traveltimepy/proto/*.proto

      - name: Test with pytest
        run: |
          pytest
        env:
          PROTO_APP_ID: ${{ secrets.PROTO_APP_ID }}
          PROTO_API_KEY: ${{ secrets.PROTO_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          API_KEY: ${{ secrets.API_KEY }}
